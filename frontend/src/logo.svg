<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Circular Green Outline Background -->
  <circle cx="50" cy="50" r="46" fill="#f0fdf4" stroke="#10b981" stroke-width="4" />
  
  <!-- Network / Wrench Hybrid emblem -->
  <g transform="translate(50,50) scale(0.9)">
    <!-- Wrench in center -->
    <path d="M-15,-30 A15,15 0 0,1 15,-30 L5,-10 L5,25 A5,5 0 0,1 -5,25 L-5,-10 Z" fill="#10b981" />
    <circle cx="0" cy="-30" r="6" fill="#f0fdf4" />
    <!-- Connector dots -->
    <circle cx="-25" cy="15" r="5" fill="#f59e0b" />
    <circle cx="25" cy="15" r="5" fill="#f59e0b" />
    <!-- Connection lines -->
    <line x1="-25" y1="15" x2="-5" y2="10" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="25" y1="15" x2="5" y2="10" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" />
  </g>
  
  <!-- "FIX" Tag at base -->
  <rect x="35" y="70" width="30" height="12" rx="4" fill="#10b981" />
  <text x="50" y="79" font-family="'Outfit', sans-serif" font-weight="bold" font-size="8" fill="#ffffff" text-anchor="middle">FIX</text>
</svg>
